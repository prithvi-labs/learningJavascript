<!DOCTYPE html>
<html lang="en">
<head>
    <title>Currency Exchange</title>
    <script src="currencyv2.js"></script>
    <link rel="stylesheet" href="currency.css">
</head>
<body>
    <h1>Currency Converter</h1>
    <datalist id="codes"></datalist>
    <form action="">

        <input class='currency' type="text" id="from" placeholder="FROM" list="codes" value="USD">

        <input class='currency' type="text" id="to" placeholder="TO" list="codes" value="NPR">

        <input type="submit" id="submit">

        <div id="result"></div>
    </form>
 



</body>
</html>
